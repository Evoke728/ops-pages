<style>:root{--b:#D4902A;--bg:#0f0e0c;--card:rgba(255,255,255,0.04);--bd:rgba(255,255,255,0.10);--tx:#fff;--sub:rgba(255,255,255,0.6);--er:#E4574c;}
*{margin:0;padding:0;box-sizing:border-box;}body{min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--bg);font-family:'Noto Sans TC',sans-serif;color:var(--tx);background-image:radial-gradient(60% 40% at 50% 0%,rgba(212,144,42,0.16),transparent 70%);padding:24px;}
.box{width:100%;max-width:380px;text-align:center;}.card{background:var(--card);border:1px solid var(--bd);border-radius:22px;padding:38px 30px;box-shadow:0 0 40px rgba(212,144,42,0.10);}
.lock{font-size:32px;margin-bottom:12px;}h1{font-size:1.2rem;font-weight:700;margin-bottom:6px;}p.hint{font-size:.9rem;color:var(--sub);margin-bottom:22px;}
input{width:100%;background:rgba(255,255,255,0.05);border:1px solid var(--bd);border-radius:50px;padding:13px 20px;color:#fff;font-size:1rem;text-align:center;letter-spacing:.15em;outline:none;}
input:focus{border-color:var(--b);box-shadow:0 0 0 3px rgba(212,144,42,0.15);}
button{width:100%;margin-top:13px;background:var(--b);color:#1a1406;font-weight:700;font-size:.95rem;padding:13px;border:none;border-radius:50px;cursor:pointer;}
.err{color:var(--er);font-size:.85rem;margin-top:13px;min-height:1.1em;}</style></head>
